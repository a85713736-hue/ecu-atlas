name: ECU research agent
on:
  workflow_dispatch:
    inputs:
      ecu:
        description: 'ECU family or hardware number'
        required: true
        default: 'Bosch MG1US008'
  schedule:
    - cron: '15 5 * * *'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Search public sources
        env:
          SEARXNG_URL: ${{ vars.SEARXNG_URL }}
          ECU_INPUT: ${{ github.event.inputs.ecu }}
        run: |
          if [ -z "$SEARXNG_URL" ]; then
            echo "::error::Set SEARXNG_URL in repository Actions variables to a trusted SearXNG instance"
            exit 1
          fi
          python agents/researcher.py "${ECU_INPUT:-Bosch MG1US008}" --output research/out/latest.json
      - name: Upload evidence for review
        uses: actions/upload-artifact@v4
        with:
          name: ecu-research-leads
          path: research/out/latest.json
          retention-days: 14
